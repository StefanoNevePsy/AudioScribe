# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true

# Architetture da compilare. Solo arm64 per build CI piu veloci e APK piu
# leggero (tutti i telefoni Android moderni sono arm64-v8a).
reactNativeArchitectures=arm64-v8a

# Nuova architettura React Native (TurboModules + Fabric)
newArchEnabled=true

# Motore JS Hermes
hermesEnabled=true

# Edge-to-edge
edgeToEdgeEnabled=false
