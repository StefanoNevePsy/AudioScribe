name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag della release (es. v1.0.0). Se vuoto ne genero uno automaticamente."
        required: false
  push:
    branches:
      # Build di validazione sui branch principali e di sviluppo.
      - main
      - master
      - claude/sleepy-gauss-K12OD
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Compute release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            # Tag vX.Y.Z: release versionata permanente
            TAG="${GITHUB_REF_NAME}"
            TITLE="AudioScribe Glass ${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
            TITLE="AudioScribe Glass ${{ github.event.inputs.version }}"
          else
            # Build automatica su push: release "latest" sempre aggiornata
            TAG="latest"
            TITLE="AudioScribe Glass — ultima build"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        # assembleRelease impacchetta il bundle JS dentro l'APK (app autonoma,
        # nessun Metro necessario). Firmato con la debug keystore (vedi
        # buildType release in app/build.gradle): chiave stabile e aggiornabile.
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          # Nome file fisso -> link di download stabile per il telefono.
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AudioScribeGlass.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioScribeGlass-apk
          path: dist/AudioScribeGlass.apk

      - name: Publish GitHub Release
        # Pubblica/aggiorna sempre una Release con l'APK allegato, cosi e
        # scaricabile direttamente dal browser del telefono (repo pubblico,
        # nessun login). I push normali aggiornano la release "latest".
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          make_latest: true
          files: dist/AudioScribeGlass.apk
          body: |
            APK Android di **AudioScribe Glass** (release autonoma con bundle JS incluso, firmata con debug keystore, arm64-v8a).

            📲 **Download diretto (telefono):**
            https://github.com/StefanoNevePsy/AudioScribe/releases/latest/download/AudioScribeGlass.apk

            - Package `com.audioscribe.glass`: si installa **accanto** alla versione precedente.
            - Gli aggiornamenti futuri si installano sopra a questo (stessa keystore).

            Per installare: apri il link sul telefono, scarica l'APK e aprilo (consenti "installa da sorgenti sconosciute").
